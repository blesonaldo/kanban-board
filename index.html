<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskboard</title>
  </head>
  <body>
    <header class="topbar">
      <h1>Taskboard</h1>
      <button id="newTaskBtn" class="btn">+ New task</button>
    </header>

    <div id="toast" class="toast" hidden></div>
    <main id="board" class="board"></main>

    <dialog id="taskDialog">
      <form id="taskForm" method="dialog">
        <h2>New task</h2>
        <label>Title
          <input id="fTitle" required maxlength="200" placeholder="What needs doing?" />
        </label>
        <label>Description
          <textarea id="fDesc" rows="3" placeholder="Optional details"></textarea>
        </label>
        <div class="row">
          <label>Priority
            <select id="fPriority">
              <option value="low">Low</option>
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
            </select>
          </label>
          <label>Due date
            <input id="fDue" type="date" />
          </label>
        </div>
        <div class="actions">
          <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
          <button type="submit" id="saveBtn" class="btn">Create</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
